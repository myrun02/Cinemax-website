<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEMAX - Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: #0a0b10;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed; width: 320px; height: 320px;
            background: rgba(0, 132, 255, 0.15); filter: blur(110px);
            border-radius: 50%; top: 10%; left: 10%; z-index: 0;
        }
        .auth-container {
            background: rgba(28, 30, 39, 0.85);
            padding: 40px 35px; border-radius: 20px;
            width: 100%; max-width: 420px; text-align: center;
            backdrop-filter: blur(10px); border: 1px solid rgba(0, 132, 255, 0.3);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6); position: relative; z-index: 1;
        }
        .auth-container h2 {
            color: #0084ff; font-weight: 800; font-size: 28px;
            letter-spacing: 3px; margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 132, 255, 0.6);
        }
        .subtitle { color: #888; font-size: 12px; margin-bottom: 22px; text-transform: uppercase; letter-spacing: 1px; }

        /* Role Switcher (Customer / Staff) */
        .role-tabs {
            display: flex; background: #161b22; border-radius: 10px;
            padding: 4px; margin-bottom: 20px; border: 1px solid #2d333b;
        }
        .role-btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            background: transparent; color: #888; font-weight: 600;
            font-size: 13px; cursor: pointer; transition: 0.3s;
        }
        .role-btn.active {
            background: #0084ff; color: white;
            box-shadow: 0 0 12px rgba(0, 132, 255, 0.4);
        }

        /* Inputs & Selects */
        .input-group { position: relative; margin-bottom: 14px; }
        .input-group i {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%); color: #0084ff; font-size: 14px;
        }
        .auth-container input, .auth-container select {
            width: 100%; padding: 13px 15px 13px 42px;
            background-color: #161b22; border: 1px solid #2d333b;
            border-radius: 10px; color: white; font-size: 14px; outline: none; transition: 0.3s;
        }
        .auth-container input:focus, .auth-container select:focus {
            border-color: #0084ff; box-shadow: 0 0 10px rgba(0, 132, 255, 0.4);
        }

        .submit-btn {
            width: 100%; padding: 14px; margin-top: 8px; background-color: #0084ff;
            color: white; border: none; border-radius: 10px; font-weight: 600;
            font-size: 15px; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; box-shadow: 0 0 15px rgba(0, 132, 255, 0.4);
        }
        .submit-btn:hover { background-color: #00a2ff; transform: translateY(-2px); }

        .msg { font-size: 12px; margin-top: 14px; min-height: 18px; }
        .error { color: #ff4d4d; }
        .success { color: #00ff88; }

        .switch-mode { margin-top: 20px; font-size: 13px; color: #888; }
        .switch-mode a { color: #0084ff; text-decoration: none; font-weight: 600; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="portalTitle">CINEMAX</h2>
    <p class="subtitle" id="portalSubtitle">Customer Login</p>

    <div class="role-tabs">
        <button class="role-btn active" id="tabCustomer" onclick="setRole('customer')"><i class="fas fa-user"></i> Customer</button>
        <button class="role-btn" id="tabStaff" onclick="setRole('staff')"><i class="fas fa-id-badge"></i> Staff</button>
    </div>

    <!-- 1. CUSTOMER LOGIN -->
    <div id="custLoginForm">
        <div class="input-group"><i class="fas fa-envelope"></i><input type="text" id="clEmail" placeholder="Email Address (or 'user')"></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="clPass" placeholder="Password (or '1234')"></div>
        <button class="submit-btn" onclick="customerLogin()">Log In</button>
    </div>

    <!-- 2. CUSTOMER SIGN UP -->
    <div id="custSignupForm" class="hidden">
        <div class="input-group"><i class="fas fa-user"></i><input type="text" id="csName" placeholder="Full Name"></div>
        <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="csEmail" placeholder="Email Address"></div>
        <div class="input-group"><i class="fas fa-phone"></i><input type="text" id="csPhone" placeholder="Phone Number"></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="csPass" placeholder="Create Password"></div>
        <button class="submit-btn" onclick="customerSignup()">Create Account</button>
    </div>

    <!-- 3. STAFF LOGIN -->
    <div id="staffLoginForm" class="hidden">
        <div class="input-group"><i class="fas fa-id-card"></i><input type="text" id="slId" placeholder="Staff ID (e.g. STF-001)"></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="slPass" placeholder="Password"></div>
        <button class="submit-btn" onclick="staffLogin()">Staff Log In</button>
    </div>

    <!-- 4. STAFF SIGN UP -->
    <div id="staffSignupForm" class="hidden">
        <div class="input-group"><i class="fas fa-id-card"></i><input type="text" id="ssId" placeholder="Staff ID (e.g. STF-001)"></div>
        <div class="input-group"><i class="fas fa-user"></i><input type="text" id="ssName" placeholder="Full Name"></div>
        <div class="input-group">
            <i class="fas fa-building"></i>
            <select id="ssDept">
                <option value="" disabled selected>Select Department</option>
                <option value="Ticketing">Ticketing</option>
                <option value="Food & Beverage">Food & Beverage</option>
                <option value="IT Support">IT Support</option>
                <option value="Management">Management</option>
            </select>
        </div>
        <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="ssEmail" placeholder="Work Email"></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="ssPass" placeholder="Password"></div>
        <button class="submit-btn" onclick="staffSignup()">Register Staff</button>
    </div>

    <p class="msg" id="feedbackMsg"></p>

    <div class="switch-mode" id="modeToggleText">
        New here? <a onclick="toggleMode()">Create an Account</a>
    </div>
</div>

<script>
    let currentRole = 'customer'; // 'customer' | 'staff'
    let currentMode = 'login';    // 'login' | 'signup'

    function updateView() {
        document.getElementById('custLoginForm').classList.add('hidden');
        document.getElementById('custSignupForm').classList.add('hidden');
        document.getElementById('staffLoginForm').classList.add('hidden');
        document.getElementById('staffSignupForm').classList.add('hidden');
        setMessage('', '');

        document.getElementById('tabCustomer').classList.toggle('active', currentRole === 'customer');
        document.getElementById('tabStaff').classList.toggle('active', currentRole === 'staff');

        const title = document.getElementById('portalTitle');
        const subtitle = document.getElementById('portalSubtitle');
        const toggleText = document.getElementById('modeToggleText');

        if (currentRole === 'customer' && currentMode === 'login') {
            document.getElementById('custLoginForm').classList.remove('hidden');
            title.innerText = 'CINEMAX';
            subtitle.innerText = 'Customer Login';
            toggleText.innerHTML = 'New here? <a onclick="toggleMode()">Create an Account</a>';
        } else if (currentRole === 'customer' && currentMode === 'signup') {
            document.getElementById('custSignupForm').classList.remove('hidden');
            title.innerText = 'JOIN CINEMAX';
            subtitle.innerText = 'Create Customer Account';
            toggleText.innerHTML = 'Already have an account? <a onclick="toggleMode()">Sign In</a>';
        } else if (currentRole === 'staff' && currentMode === 'login') {
            document.getElementById('staffLoginForm').classList.remove('hidden');
            title.innerText = 'STAFF PORTAL';
            subtitle.innerText = 'Internal Access - Login';
            toggleText.innerHTML = 'Need a staff account? <a onclick="toggleMode()">Register Staff</a>';
        } else {
            document.getElementById('staffSignupForm').classList.remove('hidden');
            title.innerText = 'STAFF PORTAL';
            subtitle.innerText = 'Internal Access - Registration';
            toggleText.innerHTML = 'Already registered? <a onclick="toggleMode()">Staff Sign In</a>';
        }
    }

    function setRole(role) {
        currentRole = role;
        currentMode = 'login';
        updateView();
    }

    function toggleMode() {
        currentMode = currentMode === 'login' ? 'signup' : 'login';
        updateView();
    }

    function setMessage(text, type) {
        const el = document.getElementById('feedbackMsg');
        el.innerText = text;
        el.className = 'msg ' + type;
    }

    // --- CUSTOMER AUTH ---
    function customerLogin() {
        const email = document.getElementById('clEmail').value.trim();
        const pass = document.getElementById('clPass').value.trim();
        const raw = localStorage.getItem('user_' + email);

        // Default test account
        if (email === 'user' && pass === '1234') {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', JSON.stringify({
                role: 'Customer', fullName: 'Demo User', email: 'user', phone: '-'
            }));
            window.location.href = 'index.html';
            return;
        }

        if (raw) {
            // Supports both new JSON format and old plain-password format
            let userObj;
            try { userObj = JSON.parse(raw); } catch { userObj = { fullName: 'Customer', email, phone: '-', password: raw }; }

            if (userObj.password === pass) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', JSON.stringify({
                    role: 'Customer',
                    fullName: userObj.fullName || 'Customer',
                    email: userObj.email,
                    phone: userObj.phone || '-'
                }));
                window.location.href = 'index.html';
                return;
            }
        }
        setMessage('Invalid credentials. Try again.', 'error');
    }

    function customerSignup() {
        const fullName = document.getElementById('csName').value.trim();
        const email = document.getElementById('csEmail').value.trim();
        const phone = document.getElementById('csPhone').value.trim();
        const password = document.getElementById('csPass').value.trim();

        if (!fullName || !email || !phone || !password) {
            setMessage('Please fill in all fields.', 'error');
            return;
        }
        const customerData = { fullName, email, phone, password };
        localStorage.setItem('user_' + email, JSON.stringify(customerData));
        setMessage('Account created! Switching to login...', 'success');
        setTimeout(() => { currentMode = 'login'; updateView(); }, 1200);
    }

    // --- STAFF AUTH ---
    function staffSignup() {
        const staffId = document.getElementById('ssId').value.trim();
        const username = document.getElementById('ssName').value.trim();
        const dept = document.getElementById('ssDept').value;
        const email = document.getElementById('ssEmail').value.trim();
        const password = document.getElementById('ssPass').value.trim();

        if (!staffId || !username || !dept || !email || !password) {
            setMessage('Error: All staff credentials are required!', 'error');
            return;
        }
        const staffData = { staffId, username, dept, email, password };
        localStorage.setItem('staff_' + staffId, JSON.stringify(staffData));
        setMessage('Staff registered! Switching to login...', 'success');
        setTimeout(() => { currentMode = 'login'; updateView(); }, 1200);
    }

    function staffLogin() {
        const staffId = document.getElementById('slId').value.trim();
        const pass = document.getElementById('slPass').value.trim();
        const raw = localStorage.getItem('staff_' + staffId);

        if (raw) {
            const staff = JSON.parse(raw);
            if (staff.password === pass) {
                localStorage.setItem('isStaffLoggedIn', 'true');
                localStorage.setItem('currentUser', JSON.stringify({
                    role: 'Staff',
                    staffId: staff.staffId,
                    fullName: staff.username,
                    dept: staff.dept,
                    email: staff.email
                }));
                setMessage(`Welcome, ${staff.username} (${staff.dept})! Redirecting...`, 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                return;
            }
        }
        setMessage('Invalid Staff ID or password.', 'error');
    }
</script>
</body>
</html>
